<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Lilipad — espace collaboratif propulsé par Digipad.">
  <title>Lilipad — Tableau collaboratif</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#fff;font-synthesis:none}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    button,a{font:inherit}button{cursor:pointer}
    .app{height:100dvh;display:flex;flex-direction:column;background:#fff}
    .bar{display:flex;align-items:center;gap:16px;min-height:62px;padding:10px 20px;background:#fff;border-bottom:1px solid #e9edf2;z-index:2}
    .identity{font-size:21px;font-weight:750;letter-spacing:-.75px;white-space:nowrap;color:#1f2937}
    .identity span{color:#2563eb}
    .subtitle{font-size:12px;color:#7b8794;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
    .actions{display:flex;align-items:center;gap:8px}
    .action{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #dce3ec;background:#fff;color:#344054;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:600;min-height:39px}
    .action:hover{background:#f3f7fc}.action:focus-visible{outline:3px solid #bad2ff;outline-offset:2px}
    .action.primary{background:#2563eb;border-color:#2563eb;color:#fff}.action.primary:hover{background:#1d4ed8}
    .action svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .workspace{flex:1;min-height:0;position:relative;background:white}
    #pad{border:0;display:block;width:100%;height:100%;background:#fff}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273444;color:white;padding:11px 17px;border-radius:9px;box-shadow:0 4px 18px #0002;font-size:13px;z-index:10}
    .toast[hidden]{display:none}
    .footer{display:none;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid #edf0f3;font-size:11px;color:#7b8794}
    @media(max-width:640px){.bar{gap:8px;padding:9px 12px;min-height:58px}.identity{font-size:19px}.subtitle{display:none}.actions{margin-left:auto;gap:5px}.action{padding:9px;min-width:38px}.action .caption{display:none}.footer{display:flex}}
  </style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="identity">Lili<span>pad</span></div>
    <div class="subtitle">Espace de travail collaboratif · Digipad</div>
    <div class="actions">
      <button class="action" id="refresh" title="Actualiser le tableau" aria-label="Actualiser le tableau">
        <svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg><span class="caption">Actualiser</span>
      </button>
      <button class="action" id="copy" title="Copier le lien du tableau" aria-label="Copier le lien du tableau">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span class="caption">Copier le lien</span>
      </button>
      <button class="action" id="fullscreen" title="Plein écran" aria-label="Plein écran">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg><span class="caption">Plein écran</span>
      </button>
      <a class="action primary" href="https://digipad.app/p/1928475/49d97780c1ecb" target="_blank" rel="noopener noreferrer" title="Ouvrir dans Digipad">
        <svg viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span class="caption">Ouvrir Digipad</span>
      </a>
    </div>
  </header>
  <main class="workspace">
    <iframe id="pad" title="Tableau collaboratif Lilipad" src="https://digipad.app/p/1928475/49d97780c1ecb" loading="eager" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <footer class="footer"><span>Tableau fourni par Digipad</span><span>Si le contenu ne s'affiche pas, ouvre-le avec le bouton ↗</span></footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
  const url='https://digipad.app/p/1928475/49d97780c1ecb';
  const pad=document.getElementById('pad');
  const toast=document.getElementById('toast');
  let hideToast;
  function announce(text){toast.textContent=text;toast.hidden=false;clearTimeout(hideToast);hideToast=setTimeout(()=>toast.hidden=true,3000)}
  document.getElementById('refresh').addEventListener('click',()=>{pad.src=url;announce('Tableau actualisé')});
  document.getElementById('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(url);announce('Lien Digipad copié')}catch{announce('Copie indisponible : utilise Ouvrir Digipad')}
  });
  document.getElementById('fullscreen').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('.workspace').requestFullscreen()}catch{announce('Le plein écran est indisponible dans ce navigateur')}
  });
})();
</script>
</body>
</html>
